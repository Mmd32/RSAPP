# Fly.io deployment with a persistent volume, so data survives redeploys.
#   fly launch --no-deploy
#   fly volumes create rsapp_data --size 1
#   fly deploy
app = "rsapp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  DATA_DIR = "/data"
  SERVE_CLIENT = "true"

[[mounts]]
  source = "rsapp_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
